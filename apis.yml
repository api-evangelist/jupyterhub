aid: jupyterhub
name: JupyterHub
description: >-
  JupyterHub is a multi-user server for Jupyter notebooks. It manages authentication, spawns and proxies multiple
  instances of the single-user Jupyter notebook server, and exposes a REST API for managing users, groups, services,
  tokens, and the proxy.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
